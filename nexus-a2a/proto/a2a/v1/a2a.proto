// A2A proto subset for rust-nexus.
//
// v1.7 (this file): adds operator chat (StreamChat), agent steering
// (SteerAgent), HITL approval queue (GetApprovalQueue, SubmitApproval,
// StreamApprovals), and operator notifications (StreamNotifications)
// for v3.10.2 WS10.
//
// v1.6.1: adds mesh topology streaming (StreamMeshTopology) with
// AgentNodeProto, MeshEdgeProto, FlowEventProto, NoiseBarometerProto
// for v3.10 WS9.
//
// v1.6: adds GML telemetry (TelemetrySnapshotProto, AnomalyScoreResponse,
// RateAdjustment) for v3.7 WS2.
//
// v1.5: adds nexus-harness ferry protocol (HarnessTask,
// HarnessTaskResult, KernelContextProto), distributed swarm coordination
// (SwarmCoordinate, BroadcastSwarmState), and 3 new RPCs for v3.7 WS1.
//
// v1.3 (this file): partial vendoring of upstream `a2aproject/A2A` v0.3.x.
// v1.3.1 adds the v0.3 RPC surface as Unimplemented stubs:
//
//   - GetTask, CancelTask, TaskSubscription,
//     CreateTaskPushNotificationConfig, ListTask,
//     GetAuthenticatedExtendedAgentCard
//
// Message shapes for the new RPCs are best-effort matches against the
// upstream v0.3 spec; field numbers may differ from a definitive
// upstream sha pin. Full vendoring with the exact upstream proto file
// is a v1.3.x follow-up that needs network access to fetch the
// upstream tag (see `nexus-a2a/VENDORED-VERSION`).
//
// rust-nexus additions on top of the upstream subset:
//
//   - AgentCard.signature (bytes)         — D-V1.2-cards
//   - AgentCard.signer_peer_id (bytes)    — D-V1.2-cards
//
// v1.0-era RPCs (load-bearing for the shell-session skill):
//   - SendStreamingMessage   (bidi — used for shell sessions)
//   - SendMessage            (unary echo — liveness)
//   - GetAgentCard           (server discovery; v1.2 signed by server)
//   - ListRegisteredAgents   (operator-facing agent listing)
//
// v1.3 additions (all return Unimplemented in v1.3 — D-V1.3-A):
//   - GetTask, CancelTask, TaskSubscription,
//     CreateTaskPushNotificationConfig, ListTask,
//     GetAuthenticatedExtendedAgentCard

syntax = "proto3";

package a2a.v1;

message Part {
    oneof part {
        string text = 1;
        bytes file = 2;
    }
}

message Message {
    string message_id = 1;
    string role = 2;
    repeated Part parts = 3;
    string task_id = 4;
}

message AgentCard {
    string name = 1;
    string description = 2;
    string version = 3;
    repeated AgentSkill skills = 4;
    // v1.2 (D-V1.2-cards): Ed25519 signature over the canonical JSON
    // encoding of the unsigned card (everything except `signature` and
    // `signer_peer_id`). Empty bytes = unsigned (accepted only when the
    // loopback gate is on / `accept_unsigned_cards = true`).
    bytes signature = 5;
    // v1.2: 32-byte Ed25519 public key of the signer. The short-form
    // `peer_id` is `BLAKE3(this)` (see [`nexus_common::PeerId`]); we ship
    // the pubkey because verifiers need it directly.
    bytes signer_peer_id = 6;
}

message AgentSkill {
    string id = 1;
    string name = 2;
    string description = 3;
    repeated string tags = 4;
}

enum TaskState {
    TASK_STATE_UNSPECIFIED = 0;
    TASK_STATE_SUBMITTED = 1;
    TASK_STATE_WORKING = 2;
    TASK_STATE_COMPLETED = 3;
    TASK_STATE_FAILED = 4;
    TASK_STATE_CANCELED = 5;
}

message StreamResponse {
    oneof payload {
        Message message = 1;
        TaskStatus task = 2;
    }
}

message TaskStatus {
    string task_id = 1;
    TaskState state = 2;
}

message Empty {}

message RegisteredAgents {
    repeated RegisteredAgent agents = 1;
}

message RegisteredAgent {
    // 32-byte BLAKE3 peer id (in v1.1 the C2 derives this from the agent's
    // overlay-side UUID via BLAKE3(uuid.bytes); see nexus-infra::a2a_lister).
    bytes peer_id = 1;
    string os = 2;
    string version = 3;
    string tag = 4;
    uint64 last_seen_unix = 5;
}

// ---------------------------------------------------------------
// v1.3 additions — upstream A2A v0.3 RPC surface (D-V1.3-A).
//
// All v1.3 server methods for these RPCs return Status::Unimplemented.
// They exist so clients dialing upstream-style endpoints get a clean
// "not implemented yet" response rather than a method-not-found error.
// Full implementations (including the message-level field shapes
// matching the exact upstream tag) are v1.3.x / v1.4 work.
// ---------------------------------------------------------------

message Task {
    string task_id = 1;
    string context_id = 2;
    TaskState state = 3;
}

message GetTaskRequest {
    string task_id = 1;
}

message CancelTaskRequest {
    string task_id = 1;
}

message TaskSubscriptionRequest {
    string task_id = 1;
}

message PushNotificationConfig {
    string task_id = 1;
    string url = 2;
    string token = 3;
}

message CreateTaskPushNotificationConfigRequest {
    PushNotificationConfig config = 1;
}

message ListTaskRequest {
    string context_id = 1;
    uint32 page_size = 2;
    string page_token = 3;
}

message ListTaskResponse {
    repeated Task tasks = 1;
    string next_page_token = 2;
}

// ---------------------------------------------------------------
// v1.4 additions — audit-log streaming + operator tokens.
// ---------------------------------------------------------------

message AuditRecordEvent {
    uint64 timestamp_unix = 1;
    string actor = 2;
    string action = 3;
    string resource = 4;
    string prev_hash = 5;
    string record_hash = 6;
}

message StreamAuditRecordsRequest {
    // Optional filters. Empty string = match all.
    string actor_filter = 1;
    string action_filter = 2;
    // Only stream records with `timestamp_unix >= since_unix`. 0 = no
    // lower bound.
    uint64 since_unix = 3;
}

message IssueOperatorTokenRequest {
    // 16-byte operator identifier (operator's UUID or a hash prefix).
    bytes operator_id = 1;
    // Requested lifetime in seconds. Server may cap to its configured
    // max (`[auth] max_token_lifetime_seconds`).
    uint64 lifetime_seconds = 2;
}

message OperatorTokenReply {
    // Wire-format 97 bytes: see nexus_a2a::tokens::OperatorToken.
    bytes token = 1;
    uint64 issued_unix = 2;
    uint64 expires_unix = 3;
}

// ---------------------------------------------------------------
// v1.5 additions — nexus-harness ferry protocol, kernel context
// observation, and distributed swarm coordination (v3.7 WS1).
//
// Ferry protocol: nexus-harness submits tool/skill invocations to
// remote nexus-agents via SubmitHarnessTask (unary) or
// StreamHarnessTask (bidi streaming). The agent executes locally
// and returns HarnessTaskResult with optional KernelContextProto
// telemetry from the sandboxed execution environment (WS1.5).
//
// Swarm coordination: multiple nexus-harness instances exchange
// consensus signals via BroadcastSwarmState (bidi streaming)
// through the nexus-a2a control plane.
// ---------------------------------------------------------------

enum SandboxVerdict {
    SANDBOX_VERDICT_UNSPECIFIED = 0;
    SANDBOX_VERDICT_NOMINAL = 1;
    SANDBOX_VERDICT_RESOURCE_EXCEEDED = 2;
    SANDBOX_VERDICT_TIMEOUT = 3;
    SANDBOX_VERDICT_CONTAINMENT_BREACH = 4;
}

message ProcessEvent {
    uint32 pid = 1;
    uint32 parent_pid = 2;
    string image_name = 3;
    uint64 timestamp_unix = 4;
    // create, terminate, thread_create, suspend, resume
    string event_type = 5;
}

message FileEvent {
    string path = 1;
    // create, read, write, delete, rename
    string operation = 2;
    uint64 bytes_affected = 3;
    uint64 timestamp_unix = 4;
}

message NetworkEvent {
    string src_addr = 1;
    string dst_addr = 2;
    uint32 dst_port = 3;
    // tcp, udp
    string protocol = 4;
    // inbound, outbound
    string direction = 5;
    uint64 timestamp_unix = 6;
}

message KernelContextProto {
    uint64 execution_duration_ns = 1;
    uint64 syscall_count = 2;
    uint64 memory_allocated_bytes = 3;
    uint32 processes_spawned = 4;
    uint32 files_touched = 5;
    uint32 network_connections = 6;
    uint32 threads_created = 7;
    SandboxVerdict sandbox_verdict = 8;
    repeated ProcessEvent process_events = 9;
    repeated FileEvent file_events = 10;
    repeated NetworkEvent network_events = 11;
}

message HarnessTask {
    string task_id = 1;
    string tool_name = 2;
    string json_arguments = 3;
    string session_id = 4;
    bytes engagement_scope_hash = 5;
    bytes operator_signature = 6;
    string target_agent_id = 7;
}

message HarnessTaskResult {
    string task_id = 1;
    string output = 2;
    bool is_error = 3;
    uint64 execution_duration_ms = 4;
    uint64 bytes_sent = 5;
    uint64 bytes_recv = 6;
    uint32 commands_run = 7;
    KernelContextProto kernel_context = 8;
}

message SwarmCoordinate {
    string round_id = 1;
    string triad_id = 2;
    bytes vote_payload = 3;
    string grammar_constraint = 4;
    bytes source_peer_id = 5;
}

// ---------------------------------------------------------------
// v1.6 — GML telemetry (WS2).
// ---------------------------------------------------------------

message TelemetrySnapshotProto {
    uint64 window_start = 1;
    uint64 window_end = 2;
    map<string, NodeFeaturesProto> node_features = 3;
}

message NodeFeaturesProto {
    string peer_id = 1;
    uint64 message_count = 2;
    uint64 bytes_sent = 3;
    uint64 bytes_recv = 4;
    uint64 task_count = 5;
    double error_rate = 6;
    uint64 total_syscalls = 7;
    uint64 total_memory_allocated = 8;
    uint64 total_processes_spawned = 9;
    uint64 total_files_touched = 10;
    uint64 total_network_connections = 11;
    uint64 sandbox_violations = 12;
}

message AnomalyScoreResponse {
    double barometer = 1;
    map<string, double> agent_attributions = 2;
    bool throttling_active = 3;
}

message RateAdjustmentRequest {
    string agent_id = 1;
}

message RateAdjustmentResponse {
    string agent_id = 1;
    double multiplier = 2;
}

// ---------------------------------------------------------------
// v1.6.1 — Mesh topology streaming for SA dashboard (v3.10 WS9).
// ---------------------------------------------------------------

enum AgentHealthProto {
    AGENT_HEALTH_UNSPECIFIED   = 0;
    AGENT_HEALTH_HEALTHY       = 1;
    AGENT_HEALTH_DEGRADED      = 2;
    AGENT_HEALTH_UNRESPONSIVE  = 3;
}

enum MeshEdgeType {
    MESH_EDGE_UNSPECIFIED       = 0;
    MESH_EDGE_FERRY_GRPC        = 1;
    MESH_EDGE_LIBP2P            = 2;
    MESH_EDGE_TELEMETRY         = 3;
    MESH_EDGE_SWARM_GOSSIPSUB   = 4;
    MESH_EDGE_KERNEL_CONTEXT    = 5;
}

message AgentNodeProto {
    string agent_id             = 1;
    string peer_id              = 2;
    AgentHealthProto health     = 3;
    uint32 current_tasks        = 4;
    repeated string skills      = 5;
    repeated string techniques  = 6;
    string role                 = 7;
    uint64 connected_at_unix    = 8;
    uint64 last_heartbeat_unix  = 9;
}

message MeshEdgeProto {
    string source_agent_id      = 1;
    string target_agent_id      = 2;
    MeshEdgeType edge_type      = 3;
    float traffic_rate_bps      = 4;
    bool is_active              = 5;
}

message FlowEventProto {
    string source_agent_id      = 1;
    string target_agent_id      = 2;
    MeshEdgeType edge_type      = 3;
    string task_id              = 4;
    uint32 payload_bytes        = 5;
    uint64 timestamp_unix       = 6;
}

message NoiseBarometerProto {
    float global_score                 = 1;
    map<string, float> per_agent       = 2;
    string controller_state            = 3;
    float throttle_floor               = 4;
}

message MeshTopologySnapshot {
    repeated AgentNodeProto agents     = 1;
    repeated MeshEdgeProto edges       = 2;
    repeated FlowEventProto flows      = 3;
    NoiseBarometerProto barometer      = 4;
    uint64 snapshot_timestamp_unix     = 5;
    uint64 sequence_number             = 6;
}

message MeshTopologyRequest {
    bool include_flows                 = 1;
    bool include_barometer             = 2;
    uint32 flow_batch_ms               = 3;
    uint32 snapshot_interval_ms        = 4;
}

message TargetEndpointProto {
    string target_id                   = 1;
    string agent_id                    = 2;
    string os_family                   = 3;
    string hostname                    = 4;
    string ip_address                  = 5;
    bool is_active                     = 6;
}

// ---------------------------------------------------------------
// v1.7 — Operator chat, steering, HITL approvals, and
// notifications (v3.10.2 WS10).
// ---------------------------------------------------------------

enum ChatMode {
    CHAT_MODE_UNSPECIFIED  = 0;
    CHAT_MODE_ORG_LLM      = 1;
    CHAT_MODE_OPERATIONS    = 2;
    CHAT_MODE_HARNESS       = 3;
    CHAT_MODE_COWORKERS     = 4;
}

message ChatRequest {
    ChatMode mode                      = 1;
    string content                     = 2;
    string session_id                  = 3;
    string engagement_id               = 4;
    map<string, string> metadata       = 5;
}

message ChatChunk {
    string text                        = 1;
    bool done                          = 2;
    string session_id                  = 3;
    ChatChunkMeta meta                 = 4;
}

message ChatChunkMeta {
    string model_used                  = 1;
    uint32 input_tokens                = 2;
    uint32 output_tokens               = 3;
    repeated string tools_invoked      = 4;
    string task_id                     = 5;
    float latency_ms                   = 6;
}

enum SteerAction {
    STEER_UNSPECIFIED  = 0;
    STEER_PAUSE         = 1;
    STEER_RESUME        = 2;
    STEER_REDIRECT      = 3;
    STEER_KILL          = 4;
    STEER_INJECT_CTX    = 5;
}

message SteerRequest {
    string agent_id                    = 1;
    string task_id                     = 2;
    SteerAction action                 = 3;
    string instruction                 = 4;
    string operator_id                 = 5;
}

message SteerResponse {
    bool success                       = 1;
    string message                     = 2;
    string previous_state              = 3;
    string new_state                   = 4;
}

message ApprovalRequestProto {
    string approval_id                 = 1;
    string skill_name                  = 2;
    string target                      = 3;
    string risk_level                  = 4;
    string requesting_agent            = 5;
    string description                 = 6;
    repeated string techniques         = 7;
    uint64 created_at_unix             = 8;
    uint64 expires_at_unix             = 9;
}

message ApprovalDecision {
    string approval_id                 = 1;
    bool approved                      = 2;
    string operator_id                 = 3;
    string reason                      = 4;
    uint64 decided_at_unix             = 5;
}

message ApprovalQueueResponse {
    repeated ApprovalRequestProto pending = 1;
    uint32 total_pending               = 2;
    uint32 approved_today              = 3;
    uint32 denied_today                = 4;
}

enum NotificationSeverity {
    NOTIFICATION_INFO      = 0;
    NOTIFICATION_WARNING   = 1;
    NOTIFICATION_CRITICAL  = 2;
}

message OperatorNotification {
    string id                          = 1;
    NotificationSeverity severity      = 2;
    string title                       = 3;
    string body                        = 4;
    string source                      = 5;
    uint64 timestamp_unix              = 6;
    bool requires_action               = 7;
    string action_ref                  = 8;
}

service A2aService {
    // v1.0 / v1.2 surface (load-bearing for shell-session).
    rpc SendMessage(Message) returns (Message);
    rpc SendStreamingMessage(stream Message) returns (stream StreamResponse);
    rpc GetAgentCard(Empty) returns (AgentCard);
    rpc ListRegisteredAgents(Empty) returns (RegisteredAgents);

    // v1.3 — Unimplemented stubs (D-V1.3-A). Field numbers and message
    // shapes are best-effort matches against upstream v0.3; v1.4 will
    // re-anchor to a concrete sha pin.
    rpc GetTask(GetTaskRequest) returns (Task);
    rpc CancelTask(CancelTaskRequest) returns (Task);
    rpc TaskSubscription(TaskSubscriptionRequest) returns (stream StreamResponse);
    rpc CreateTaskPushNotificationConfig(CreateTaskPushNotificationConfigRequest) returns (PushNotificationConfig);
    rpc ListTask(ListTaskRequest) returns (ListTaskResponse);
    rpc GetAuthenticatedExtendedAgentCard(Empty) returns (AgentCard);

    // v1.4 — audit-log streaming + operator tokens (D-V1.4-D + Phase 1.4.3).
    rpc StreamAuditRecords(StreamAuditRecordsRequest) returns (stream AuditRecordEvent);
    rpc IssueOperatorToken(IssueOperatorTokenRequest) returns (OperatorTokenReply);

    // v1.5 — nexus-harness ferry protocol + swarm coordination (v3.7 WS1).
    rpc SubmitHarnessTask(HarnessTask) returns (HarnessTaskResult);
    rpc StreamHarnessTask(stream HarnessTask) returns (stream HarnessTaskResult);
    rpc BroadcastSwarmState(stream SwarmCoordinate) returns (stream SwarmCoordinate);

    // v1.6 — GML telemetry RPCs (WS2).
    rpc SubmitTelemetrySnapshot(TelemetrySnapshotProto) returns (Empty);
    rpc QueryAnomalyScore(Empty) returns (AnomalyScoreResponse);
    rpc AdjustAgentRate(RateAdjustmentRequest) returns (RateAdjustmentResponse);

    // v1.6.1 — Mesh topology streaming (v3.10 WS9).
    rpc StreamMeshTopology(MeshTopologyRequest) returns (stream MeshTopologySnapshot);

    // v1.7 — Operator chat + control (v3.10.2).
    rpc StreamChat(ChatRequest) returns (stream ChatChunk);
    rpc SteerAgent(SteerRequest) returns (SteerResponse);
    rpc GetApprovalQueue(Empty) returns (ApprovalQueueResponse);
    rpc SubmitApproval(ApprovalDecision) returns (Empty);
    rpc StreamApprovals(Empty) returns (stream ApprovalRequestProto);
    rpc StreamNotifications(Empty) returns (stream OperatorNotification);
}
