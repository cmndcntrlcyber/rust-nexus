[package]
name = "nexus-console"
version = "0.1.0"
edition = "2021"
description = "Tauri v2 operator console for rust-nexus (v1.1 simple-mesh integration)."

[lib]
name = "nexus_console"
path = "src/lib.rs"

[[bin]]
name = "nexus-console"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nexus-common = { path = "../../nexus-common" }
nexus-a2a = { path = "../../nexus-a2a" }
nexus-mesh = { path = "../../nexus-mesh" }
blake3 = "1"
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1.35", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1"
thiserror = "1.0"
libp2p = { version = "0.53", features = ["tcp", "noise", "yamux", "tokio", "macros", "identify", "gossipsub", "ping"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "channel"] }
http = "1"
open = "5"

[features]
custom-protocol = ["tauri/custom-protocol"]
